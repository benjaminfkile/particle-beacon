name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: contracts check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run contracts:check
      - name: beacon library check
        run: npm run beacon:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: prod
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: assume aws role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          mask-aws-account-id: true
          aws-region: ${{ vars.AWS_REGION }}
      - name: login to ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: build and push
        env:
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker buildx build \
            --platform linux/arm64,linux/amd64 \
            -t ${ECR_REPOSITORY}:${IMAGE_TAG} \
            --push .
      - name: get gateway token
        id: token
        env:
          TOKEN_URL: ${{ secrets.GATEWAY_TOKEN_URL }}
          CLIENT_ID: ${{ secrets.GATEWAY_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GATEWAY_CLIENT_SECRET }}
        run: |
          token=$(curl -sS -X POST "$TOKEN_URL" \
            -d grant_type=client_credentials \
            -d scope=mgmt/deploy \
            -u "$CLIENT_ID:$CLIENT_SECRET" | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).access_token))')
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: deploy to gateway
        id: deploy
        env:
          GATEWAY_BASE_URL: ${{ secrets.GATEWAY_BASE_URL }}
          GATEWAY_SERVICE_NAME: ${{ secrets.GATEWAY_SERVICE_NAME }}
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          resp=$(curl -sS -f -X POST "${GATEWAY_BASE_URL}/mgmt/services/${GATEWAY_SERVICE_NAME}/deploy" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag\":\"${IMAGE_TAG}\"}")
          echo "$resp"
          id=$(printf '%s' "$resp" | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).deployId||""))}catch{process.stdout.write("")}})')
          echo "deployment_id=$id" >> "$GITHUB_OUTPUT"
      - name: wait for done
        env:
          GATEWAY_BASE_URL: ${{ secrets.GATEWAY_BASE_URL }}
          GATEWAY_SERVICE_NAME: ${{ secrets.GATEWAY_SERVICE_NAME }}
          TOKEN: ${{ steps.token.outputs.token }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          deadline=$((SECONDS + 600))
          while [ $SECONDS -lt $deadline ]; do
            status=$(curl -sS -f "${GATEWAY_BASE_URL}/mgmt/deploys/${DEPLOYMENT_ID}" \
              -H "Authorization: Bearer ${TOKEN}" | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).deploy.status||""))}catch{process.stdout.write("")}})')
            echo "status=$status"
            case "$status" in
              done) exit 0 ;;
              failed|partial) echo "deploy $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "deploy did not reach done within 10 minutes"
          exit 1
